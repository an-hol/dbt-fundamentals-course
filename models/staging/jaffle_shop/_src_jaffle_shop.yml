sources:
  - name: jaffle_shop
    database: dev
    schema: "raw"          
    config:
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 12
          period: day
      loaded_at_field: _etl_loaded_at
    tables:
      - name: jaffle_shop_customers
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
        config:
          freshness: null
      - name: jaffle_shop_orders
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
        